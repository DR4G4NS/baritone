
name: Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Executing tests
      run: ./gradlew test deterministicTest headlessReplayTest

    - name: Archive deterministic and replay reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pathfinding-test-reports
        path: |
          build/reports/tests/
          build/test-results/

  client-gametest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: gradle
    - name: Grant Gradle wrapper permissions
      run: chmod +x gradlew client-gametest/gradlew
    - name: Build Fabric artifact
      run: ./gradlew :fabric:remapJar --no-daemon
    - name: Run automated client pathfinding smoke tests
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      run: xvfb-run -a ./client-gametest/gradlew -p client-gametest runClientGameTest --no-daemon
    - name: Archive client evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: client-gametest-smoke-evidence
        path: |
          client-gametest/build/run/clientGameTest/logs/
          client-gametest/build/run/clientGameTest/screenshots/
          client-gametest/build/run/clientGameTest/crash-reports/
