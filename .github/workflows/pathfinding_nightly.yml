name: Pathfinding Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  deterministic-replay-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run deterministic, replay, and benchmark tiers
        run: ./gradlew test deterministicTest headlessReplayTest benchmark
      - name: Archive pathfinding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathfinding-nightly-evidence
          path: |
            build/benchmarks/
            build/reports/tests/
            build/test-results/

  client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: gradle
      - name: Grant Gradle wrapper permissions
        run: chmod +x gradlew client-gametest/gradlew
      - name: Build Fabric artifact
        run: ./gradlew :fabric:remapJar --no-daemon
      - name: Run client scenario tier with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: xvfb-run -a ./client-gametest/gradlew -p client-gametest runClientGameTest --no-daemon
      - name: Archive client scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathfinding-nightly-client-evidence
          path: |
            client-gametest/build/run/clientGameTest/logs/
            client-gametest/build/run/clientGameTest/screenshots/
            client-gametest/build/run/clientGameTest/crash-reports/
