plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'baritone.gametest'
version = '1.0.0'

base {
    archivesName = 'baritone-client-gametest'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    def defaultBaritone = file("../fabric/build/libs/baritone-fabric-${minecraft_version}-SNAPSHOT.jar")
    def configuredBaritone = providers.gradleProperty('baritoneArtifact').map { file(it) }.getOrElse(defaultBaritone)
    compileOnly files(configuredBaritone)
    runtimeOnly files(configuredBaritone)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'baritone-client-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
        username = 'BaritoneGameTest'
    }
}

def defaultBaritoneArtifact = file("../fabric/build/libs/baritone-fabric-${minecraft_version}-SNAPSHOT.jar")
def baritoneArtifact = providers.gradleProperty('baritoneArtifact').map { file(it) }.getOrElse(defaultBaritoneArtifact)

tasks.register('verifyBaritoneArtifact') {
    inputs.file(baritoneArtifact)
    doLast {
        if (!baritoneArtifact.isFile()) {
            throw new GradleException("Missing remapped Baritone Fabric artifact: ${baritoneArtifact}. Run ../gradlew :fabric:remapJar first.")
        }
    }
}

tasks.named('runClientGameTest') {
    dependsOn tasks.named('verifyBaritoneArtifact')
}
